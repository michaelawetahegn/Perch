# Memory here is a host-stability setting, not a speed knob. See NOTES.md
# (2026-08-07 freeze). WSL gets 7GB; these numbers must sum to well under that
# with room for the test JVM and the OS. Do not raise them.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m

# Single-module project (:app) — parallel execution buys nothing across one
# module but does spawn extra worker JVMs. Off on purpose.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.java.home=/home/michael/.jdks/temurin-17

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
